[package]
name = "sstr"
version = "0.3.1"
edition = "2024"
description = "An ergonomic stack allocated String."
authors = ["Futex Labs <opensource@futexlabs.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Futex-Labs/Stack-String"

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1.0.229", optional = true, default-features = false, features = ["derive"] }
sqlx = { version = "0.9.0", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros"] }
tokio-test = "0.4.5"

[features]
nightly = []
sqlx-postgres = ["sqlx/postgres", "sqlx/runtime-tokio"]
sqlx-mysql = ["sqlx/mysql", "sqlx/runtime-tokio"]
sqlx-sqlite = ["sqlx/sqlite", "sqlx/runtime-tokio"]
